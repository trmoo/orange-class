# 오렌지 데이터 교실 — © 2026 티쳐무 · 모든 권리 보유
# 푸시할 때마다 시험을 돌리고 빌드해 GitHub Pages 로 올린다. dist 는 커밋하지 않는다.
# 입장 코드 원문(입장코드.md)과 낱말 목록(*.local.json)은 저장소에 없다 — 여기서는 해시(src/codes.js)만 쓴다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: 시험 (계산·데이터·입장 코드 해시)
        run: npm test

      # 시험은 카드를 그리는 코드(DOM)를 돌리지 않는다 — 빼면 문법 오류가 빌드에서야 터진다
      - name: 소스 전수 검사
        run: npm run check:syntax

      # build 는 tools/check-dist.mjs 로 크기·저작권·배너·바깥 파일까지 본다
      - run: npm run build

      # ⚠ 셸 변수 이름은 반드시 ASCII 로 쓴다. 한글로 쓰면 bash 가 command not found 로 죽는다.
      - name: 빌드 결과 점검
        run: |
          FILE=dist/index.html
          test -f "$FILE" || { echo "::error::$FILE 이 없습니다"; exit 1; }
          SIZE=$(wc -c < "$FILE")
          echo "빌드 크기: ${SIZE} 바이트"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::빌드 결과가 너무 작습니다 (${SIZE} 바이트)."
            exit 1
          fi
          grep -q '© 2026 티쳐무' "$FILE" || { echo "::error::저작권 표시가 없습니다"; exit 1; }
          # 바깥 자원을 부르면 인터넷 없는 교실에서 깨진다 (w3.org 는 SVG 이름공간이라 내려받지 않는다)
          OUTSIDE=$(grep -Eo 'https?://[^ "<>)]+' "$FILE" | grep -v 'www.w3.org' | sort -u || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::바깥 자원을 참조합니다. 오프라인에서 열리지 않습니다."
            echo "$OUTSIDE"
            exit 1
          fi
          echo "✅ 점검 통과"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
